# Server
server.port=8089
spring.application.name=neet-updates

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/neet_updates_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Eureka (no eureka-client in pom.xml; routed via http://localhost:8089 in api-gateway)
eureka.client.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/